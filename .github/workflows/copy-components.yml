name: Copy verified components to draft release
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing release containing component ZIPs
        required: true
        type: string
      target_tag:
        description: Draft release with the next signed catalog
        required: true
        type: string
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      TARGET_TAG: ${{ inputs.target_tag }}
    steps:
      - name: Require a draft target and safe tags
        run: |
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TARGET_TAG" --json isDraft --jq '.isDraft' | grep -x true
          gh release download "$TARGET_TAG" --pattern catalog.json
      - name: Copy exact catalog packages
        shell: python
        run: |
          import hashlib, json, os, re, subprocess
          with open('catalog.json') as source:
              catalog = json.load(source)
          def assets(tag):
              return json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'assets']))['assets']
          sources = {a['name']: a for a in assets(os.environ['SOURCE_TAG'])}
          targets = {a['name']: a for a in assets(os.environ['TARGET_TAG'])}
          for app in catalog['payload']['apps']:
              package = app['package']
              name = package['file']
              assert re.fullmatch(r'(sonora|worktable|padforge|velvet|nook|umbra)-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.zip', name)
              if name in targets:
                  assert targets[name]['size'] == package['size']
                  assert targets[name]['digest'] == 'sha256:' + package['sha256']
                  print(f'Already verified: {name}')
                  continue
              if name not in sources:
                  print(f'New package must be staged separately: {name}')
                  continue
              subprocess.run(['gh', 'release', 'download', os.environ['SOURCE_TAG'], '--pattern', name], check=True)
              digest = hashlib.sha256()
              size = 0
              with open(name, 'rb') as source:
                  while data := source.read(1024 * 1024):
                      digest.update(data)
                      size += len(data)
              assert digest.hexdigest() == package['sha256'], f'Hash mismatch: {name}'
              assert size == package['size'], f'Size mismatch: {name}'
              assert subprocess.check_output(['gh', 'release', 'view', os.environ['TARGET_TAG'], '--json', 'isDraft', '--jq', '.isDraft'], text=True).strip() == 'true', 'Target must remain draft'
              subprocess.run(['gh', 'release', 'upload', os.environ['TARGET_TAG'], name], check=True)
              print(f'Copied verified {name}')
